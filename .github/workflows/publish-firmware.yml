name: Publish Firmware

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get-release-info:
    name: Get Release Info
    runs-on: ubuntu-latest
    steps:
      - name: Get Latest Release
        id: get-latest-release
        uses: joutvhu/get-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          debug: true
          latest: true
          prerelease: true
    outputs:
      summary: ${{ steps.get-latest-release.outputs.body }}
      url: ${{ steps.get-latest-release.outputs.html_url }}
      version: ${{ steps.get-latest-release.outputs.tag_name }}

  build-firmware:
    name: Build Firmware
    uses: esphome/workflows/.github/workflows/build.yml@9f6577fd37b5cf773ab1b9be929714a0dcd15661  # 2026.7.0
    with:
      files: |
        rgbww-led-controller-5a.factory.yaml
        rgbww-led-controller-10a.factory.yaml
      esphome-version: latest
      release-summary: ${{ needs.get-release-info.outputs.summary }}
      release-url: ${{ needs.get-release-info.outputs.url }}
      release-version: ${{ needs.get-release-info.outputs.version }}

  upload-to-release:
    name: Upload to Release
    uses: esphome/workflows/.github/workflows/upload-to-gh-release.yml@9f6577fd37b5cf773ab1b9be929714a0dcd15661  # 2026.7.0
    needs:
      - build-firmware
    with:
      version: ${{ needs.build-firmware.outputs.version }}

  promote-draft:
    name: Promote Draft to Release
    needs:
      - build-firmware
      - upload-to-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote Draft to Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: ${{ needs.build-firmware.outputs.version }}
          prerelease: false
          makeLatest: true
          generateReleaseNotes: false
          token: ${{ secrets.GITHUB_TOKEN }}
