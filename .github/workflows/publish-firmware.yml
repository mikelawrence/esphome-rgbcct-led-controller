name: Publish Firmware
# This will grab the latest draft Release, build the firmware, upload files to Github draft Release
# and promote the draft Release to Latest full Release

on:
  # release:
  #   types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calver:
    name: Get Latest Draft Release Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Find latest draft CalVer release
        id: calver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Fail fast:
          # -e = stop on command error
          # -u = error on unset variable
          # -o pipefail = fail pipeline if any command in it fails
          set -euo pipefail

          # Query GitHub releases and keep only draft release tags.
          # Output is one tag per line, written to a temp file for easier debugging.
          gh release list --limit 100 --json tagName,isDraft \
            --jq '.[] | select(.isDraft) | .tagName' > draft_tags.txt

          # If the file is empty, there are no draft releases at all.
          if [ ! -s draft_tags.txt ]; then
            echo "::error::No draft releases found in this repository"
            exit 1
          fi

          # Keep only tags that match your CalVer format:
          #   YY.M.N
          # Examples:
          #   25.7.1   -> match
          #   25.12.3  -> match
          #   v25.7.1  -> no match
          #   2025.7.1 -> no match
          grep -E '^[0-9]{2}\.[0-9]{1,2}\.[0-9]+$' draft_tags.txt > calver_draft_tags.txt || true

          # If draft releases exist but none match the expected CalVer pattern,
          # fail the step and show the tags we actually found for troubleshooting.
          if [ ! -s calver_draft_tags.txt ]; then
            echo "::error::Draft releases exist, but none match CalVer pattern YY.M.N"
            echo "Found draft tags:"
            sed 's/^/  - /' draft_tags.txt
            exit 1
          fi

          # Sort the tags numerically by:
          #   field 1 = YY
          #   field 2 = M
          #   field 3 = N
          #
          # We use awk to build a sortable key with zero-padding:
          #   25.7.3 -> 25 07 000000003 25.7.3
          #
          # Then:
          # - sort numerically by the first 3 columns
          # - take the last row (highest / latest)
          # - extract the original tag from column 4
          latest_tag=$(
            awk -F. '{printf "%02d %02d %09d %s\n", $1, $2, $3, $0}' calver_draft_tags.txt \
              | sort -k1,1n -k2,2n -k3,3n \
              | tail -n1 \
              | awk '{print $4}'
          )

          # Defensive check: if for some reason sorting produced no result,
          # fail with a GitHub Actions error annotation.
          if [ -z "$latest_tag" ]; then
            echo "::error::Failed to determine the latest draft CalVer tag"
            exit 1
          fi

          # Export the result so later workflow steps can use it as:
          #   $LATEST_DRAFT_TAG
          echo "tag=$latest_tag" >> "$GITHUB_ENV"

          # Normal log output for visibility in the step logs.
          echo "Latest draft tag: $latest_tag"
    outputs:
      version: ${{ steps.calver.outputs.tag }}

  draft-info:
    name: Get Draft Release Info
    needs:
      - calver
    runs-on: ubuntu-latest
    steps:
      - name: Get Latest Release
        id: get-latest-release
        uses: joutvhu/get-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.calver.outputs.version }}
    outputs:
      summary: ${{ steps.get-latest-release.outputs.body }}
      url: ${{ steps.get-latest-release.outputs.html_url }}
      version: ${{ steps.get-latest-release.outputs.tag_name }}

  build-firmware:
    name: Build Firmware
    needs:
      - draft-info
    uses: esphome/workflows/.github/workflows/build.yml@9f6577fd37b5cf773ab1b9be929714a0dcd15661  # 2026.7.0
    with:
      files: |
        rgbww-led-controller-5a.factory.yaml
        rgbww-led-controller-10a.factory.yaml
      esphome-version: latest
      release-summary: ${{ needs.draft-info.outputs.summary }}
      release-url: ${{ needs.draft-info.outputs.url }}
      release-version: ${{ needs.draft-info.outputs.version }}

  upload-to-release:
    name: Upload to Release
    uses: esphome/workflows/.github/workflows/upload-to-gh-release.yml@9f6577fd37b5cf773ab1b9be929714a0dcd15661  # 2026.7.0
    needs:
      - build-firmware
    with:
      version: ${{ needs.get-release-info.outputs.version }}

  promote-pre-release:
    name: Promote Pre-Release to Release
    needs:
      - upload-to-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote Draft to Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: ${{ needs.get-release-info.outputs.version }}
          prerelease: false
          makeLatest: true
          generateReleaseNotes: false
          token: ${{ secrets.GITHUB_TOKEN }}
