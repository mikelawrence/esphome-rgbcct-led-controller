name: Create Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calver:
    name: Get Latest Draft Release
    runs-on: ubuntu-latest
    steps:
      - name: Find latest draft release
        id: calver
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # Get draft releases with the fields we need.
          gh release list --limit 100 \
            --json tagName,isDraft,name,publishedAt,createdAt,url \
            --jq '.[] | select(.isDraft)' > draft_releases.jsonl

          if [ ! -s draft_releases.jsonl ]; then
            echo "::error::No draft releases found in this repository"
            exit 1
          fi

          # Pick the newest draft by createdAt.
          latest_json=$(
            jq -s '
              sort_by(.createdAt)
              | last
            ' draft_releases.jsonl
          )

          if [ -z "${latest_json}" ] || [ "${latest_json}" = "null" ]; then
            echo "::error::Failed to determine the latest draft release"
            exit 1
          fi

          latest_tag=$(jq -r '.tagName // ""' <<< "$latest_json")
          release_url=$(jq -r '.url // ""' <<< "$latest_json")
          release_name=$(jq -r '.name // ""' <<< "$latest_json")

          # If body is not available in gh release list output, fetch it from gh api.
          # For untagged drafts, use the release URL path to identify the release page humans can open.
          release_body="Draft release"
          if [ -n "$release_name" ]; then
            release_body="$release_name"
          elif [ -n "$latest_tag" ]; then
            release_body="Draft release for $latest_tag"
          fi

          if [ -z "$release_url" ]; then
            echo "::error::Draft release URL was empty"
            exit 1
          fi

          echo "LATEST_DRAFT_TAG=$latest_tag" >> "$GITHUB_ENV"
          echo "RELEASE_URL=$release_url" >> "$GITHUB_ENV"
          echo "RELEASE_BODY=$release_body" >> "$GITHUB_ENV"

          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"
          echo "release_body=$release_body" >> "$GITHUB_OUTPUT"

          echo "Latest draft tag: $latest_tag"
          echo "Release URL: $release_url"
          echo "Release body: $release_body"
    outputs:
      summary: ${{ steps.calver.outputs.release_body }}
      url: ${{ steps.calver.outputs.release_url }}
      version: ${{ steps.calver.outputs.tag }}

  build-firmware:
    name: Build Firmware
    needs:
      - calver
    uses: esphome/workflows/.github/workflows/build.yml@9f6577fd37b5cf773ab1b9be929714a0dcd15661  # 2026.7.0
    with:
      files: |
        rgbww-led-controller-5a.factory.yaml
        rgbww-led-controller-10a.factory.yaml
      esphome-version: latest
      release-summary: ${{ needs.draft-info.outputs.summary }}
      release-url: ${{ needs.draft-info.outputs.url }}
      release-version: ${{ needs.draft-info.outputs.version }}

  upload-to-release:
    name: Upload to Release
    uses: esphome/workflows/.github/workflows/upload-to-gh-release.yml@9f6577fd37b5cf773ab1b9be929714a0dcd15661  # 2026.7.0
    needs:
      - build-firmware
    with:
      version: ${{ needs.build-firmware.outputs.version }}

  promote-draft:
    name: Promote Draft to Release
    needs:
      - build-firmware
      - upload-to-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote Draft to Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: ${{ needs.build-firmware.outputs.version }}
          prerelease: false
          makeLatest: true
          generateReleaseNotes: false
          token: ${{ secrets.GITHUB_TOKEN }}
