packages:
  # Include all of the core configuration
  core: !include rgbww-led-controller-10a.yaml

esphome:
  project:
    name: Mike Lawrence.RGBWW LED Controller 10 Amp
    # This will be replaced by the github workflows with the `release` version
    version: dev

ota:
  - platform: http_request
    id: ota_http_request
    on_begin:
      - ble.disable:
      - logger.log: "OTA starting: BLE Disabled"

update:
  - platform: http_request
    name: Firmware
    source: https://mikelawrence.github.io/esphome-rgbcct-led-controller/firmware/rgbww-led-controller-10a.manifest.json

http_request:

dashboard_import:
  package_import_url: github://mikelawrence/esphome-rgbcct-led-controller/rgbww-led-controller-10a.yaml@main
  import_full_config: true

wifi:
  power_save_mode: none

esp32_improv:
  authorizer: none

improv_serial:
