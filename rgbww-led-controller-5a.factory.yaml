substitutions:
  ref: "main"

packages:
  # Include all of the core configuration
  core: !include rgbww-led-controller-5a.yaml

dashboard_import:
  package_import_url: github://mikelawrence/esphome-rgbcct-led-controller/${name}.yaml@${ref}
  import_full_config: true

esphome:
  project:
    name: Mike Lawrence.${friendly_name}
    # This will be replaced by github workflows with the `release` version
    version: dev

web_server:
  port: 80
  version: 3
  auth:
    username: "sensor"
    password: "password"
    type: digest

ota:
  - platform: http_request
    id: ota_http_request

http_request:

update:
  - platform: http_request
    id: update_http_request
    name: Firmware
    source: https://mikelawrence.github.io/esphome-rgbcct-led-controller/firmware/${name}.manifest.json
